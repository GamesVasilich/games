<html class="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID user</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>
<body>

    <div class="bg-animation" id="stars-container"></div>

    <header class="panel">
        <div class="panel">
            <box>
                <a href="../index.html" class="back-link">← На главную HUD</a>
                <h1>Профиль пользователя</h1>
            </box>
        </div>
    </header>

    <main class="profile-main">
        <!-- Верхняя строка: коротко о себе / о чем думаешь -->
        <div class="status-top-bar">
            <div class="thought-bubble" id="display-thought" contenteditable="false">Загрузка статуса...</div>
            <button class="button-0" id="edit-btn" onclick="toggleEditMode()">✏️ Редактировать</button>
        </div>

        <div class="profile-grid">
            <!-- Левая колонка: аватарка + статус (3 вида) -->
            <div class="profile-left">
                <div class="avatar-box" id="avatar-container">
                    <img id="profile-img" src="" alt="Аватар" style="display: none;">
                    <span id="profile-emoji">🎮</span>
                </div>
                <input type="file" id="avatar-file-input" accept="image/png, image/jpeg" style="display: none;" onchange="handleImageUpload(event)">
                <button class="button-0 upload-btn" onclick="document.getElementById('avatar-file-input').click()" id="upload-photo-ui" style="display:none;">📁 Загрузить фото</button>

                <div class="status-box">
                    <label>Статус:</label>
                    <select id="user-status-select" disabled onchange="saveProfileData()">
                        <option value="online">🟢 В сети</option>
                        <option value="ingame">🟣 В игре</option>
                        <option value="offline">⚪ Не в сети</option>
                    </select>
                </div>
            </div>

            <!-- Центральная колонка: идеи, описание, дата рождения и возраст -->
            <div class="profile-center">
                <div class="info-card">
                    <h3>💡 О себе и идеи</h3>
                    <div class="editable-field" id="display-bio" contenteditable="false">Здесь будет описание ваших идей и проектов...</div>
                </div>

                <div class="info-card">
                    <h3>🎂 Дата рождения</h3>
                    <div class="birthday-row">
                        <input type="date" id="user-birthdate" disabled onchange="saveProfileData()">
                        <span id="calculated-age" class="age-badge">Возраст: -- лет</span>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: статистика -->
            <div class="profile-right">
                <div class="info-card">
                    <h3>📊 Статистика</h3>
                    <p class="stats-note">Сделаем позже</p>
                    <ul class="stats-list">
                        <li><span>Статус:</span> <strong id="stat-status-text">В сети</strong></li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
